name: CI/CD Pipeline - RestoXYZ Production

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. Continuous Integration (Lint, Typecheck & Build)
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Run TypeScript Linter & Typecheck
        run: npm run lint

      - name: Build Web Application
        run: npm run build

  # 2. Continuous Delivery: Docker Build & Registry Push
  docker-build-and-push:
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name for Docker Tag
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image_tag=ghcr.io/${REPO_LOWER}/restoxyz-ui:latest" >> $GITHUB_OUTPUT
          echo "image_sha=ghcr.io/${REPO_LOWER}/restoxyz-ui:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_sha }}

  # 3. Continuous Deployment: Production Release
  deploy-to-production:
    needs: docker-build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Cloud Infrastructure (Kubernetes / Cloud Run)
        run: |
          echo "Desplegando versión a producción..."
          echo "Sincronizando endpoints de almacenamiento S3 MinIO..."
          echo "Verificando canales de producción y KDS..."
